name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The deterministic pipeline profiles (splice.stage, splice.dtools) fail
      # closed without a native sandbox backend. On Linux that backend needs
      # bubblewrap plus the splice-linux-sandbox helper. Without them the
      # pipeline refuses every stage subprocess and its tests skip, so CI would
      # report green on untested code.
      #
      # The helper must be on PATH. Under `go test` the running executable is
      # the test binary, which does not serve the hidden helper subcommand, so
      # the PATH tier is the only resolution tier that yields a working helper.
      - name: Install sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
          go build -o "$HOME/.local/bin/splice-linux-sandbox" ./cmd/splice-linux-sandbox
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify sandbox backend is selected
        run: |
          command -v bwrap
          command -v splice-linux-sandbox

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Cross-vet
        run: GOOS=windows go vet ./internal/memd/...

      - name: Test
        run: go test -race ./...
        # Tests must not depend on models.dev. A mid-run fetch previously raced a pricing assertion.
        env:
          SPLICE_DISABLE_MODELS_FETCH: "1"

      - name: Build
        run: go build ./cmd/splice

      - name: Cross-build
        run: |
          GOOS=windows GOARCH=amd64 go build ./cmd/splice
          GOOS=linux GOARCH=amd64 go build ./cmd/splice

  memd:
    name: memd sidecar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: memd/go.mod
          cache: true
          cache-dependency-path: memd/go.sum

      - name: Vet
        working-directory: memd
        run: go vet ./...

      - name: Test
        working-directory: memd
        run: go test -race ./...

      - name: Build
        working-directory: memd
        run: go build -o splice-memd .
